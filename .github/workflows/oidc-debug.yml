name: oidc-debug
on:
  push:
    branches: [main]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - run: |
          curl -s "$ACTIONS_ID_TOKEN_REQUEST_URL" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | python3 -c 'import json,sys; v=json.load(sys.stdin)["value"]; p=v.split(".")[1]; p += "=" * (-len(p) % 4); import base64; print(base64.urlsafe_b64decode(p).decode())'

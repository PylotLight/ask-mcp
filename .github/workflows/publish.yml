name: publish
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Debug OIDC claims (temporary)
        run: curl -s "$ACTIONS_ID_TOKEN_REQUEST_URL" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | python3 -c 'import json,sys; v=json.load(sys.stdin)["value"]; p=v.split(".")[1]; p += "=" * (-len(p) % 4); import base64; print(base64.urlsafe_b64decode(p).decode())'
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="v$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || { echo "tag $tag != package.json $version"; exit 1; }
      - run: bun run build
      - run: npm install -g npm@latest
      - name: Publish to npm
        run: npm publish --provenance --access public
